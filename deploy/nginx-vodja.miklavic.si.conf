# nginx site for https://vodja.miklavic.si – install as /etc/nginx/sites-available/vodja.miklavic.si
# (deploy/server-setup.sh does this), then `certbot --nginx -d vodja.miklavic.si` fills in the TLS lines.
#
# The site is 100 % static: `current` is a symlink to the newest folder in /var/www/vodja.miklavic.si/releases
# (deploy/deploy.sh flips it atomically, so a visitor never sees a half-uploaded release).

server {
    listen 80;
    listen [::]:80;
    server_name vodja.miklavic.si;

    # certbot HTTP-01 challenge; everything else goes to https
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vodja.miklavic.si;

    ssl_certificate     /etc/letsencrypt/live/vodja.miklavic.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vodja.miklavic.si/privkey.pem;

    root /var/www/vodja.miklavic.si/current;
    index index.html;

    # --- security headers --------------------------------------------------------------------------------------
    # No CSP on purpose: the app loads Google Sign-In, Google Fonts, Drive thumbnails and calls Apps Script; a wrong
    # CSP would silently break sign-in. Add one only after testing every page.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Google Sign-In (FedCM / popup) needs this to stay "same-origin-allow-popups", not "same-origin"
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # --- compression -------------------------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    types { application/manifest+json webmanifest; }

    # --- caching -----------------------------------------------------------------------------------------------
    # GitHub Pages sent max-age=600 for everything; keep that spirit. HTML, service worker and data/*.json must always
    # be revalidated (a deploy has to show up right away – sw.js is network-first for the same reason).
    location = /sw.js              { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/vodja-headers.conf; }
    location = /index.html         { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/vodja-headers.conf; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/vodja-headers.conf; }
    location /data/                { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/vodja-headers.conf; }
    # css/js are versioned with ?v=NNN in index.html, images never change under the same name
    location ~* \.(css|js)$        { add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/snippets/vodja-headers.conf; }
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=2592000" always; include /etc/nginx/snippets/vodja-headers.conf; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Repo files that are not part of the site (deploy.sh does not upload them either – this is belt and braces)
    location ~ ^/(\.git|\.github|apps-script|push-worker|scripts|deploy|docs)(/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }
}
